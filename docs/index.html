<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mini-GPT · In-browser demo</title>
<style>
  :root {
    --bg: #f7f7f5; --panel: #ffffff; --text: #1d1d1f; --muted: #6b6b70;
    --border: #e2e2e0; --accent: #5b4bdb; --accent-text: #ffffff; --error: #c0392b;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121214; --panel: #1c1c1f; --text: #ececf0; --muted: #9a9aa3;
      --border: #2c2c31; --accent: #8b7cf6; --accent-text: #121214; --error: #ff6b5b;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font-family: system-ui, -apple-system, "Segoe UI", sans-serif; line-height: 1.5; }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 32px 16px; }
  header h1 { margin: 0 0 4px; font-size: 1.8rem; }
  header p { margin: 0; color: var(--muted); }
  #status { margin-top: 12px; font-size: .9rem; color: var(--muted); }
  .grid { display: grid; grid-template-columns: 320px 1fr; gap: 20px; margin-top: 24px; }
  @media (max-width: 800px) { .grid { grid-template-columns: 1fr; } }
  .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 18px; }
  label { display: block; font-size: .85rem; font-weight: 600; margin: 14px 0 6px; }
  label span { float: right; font-weight: 400; color: var(--muted); font-variant-numeric: tabular-nums; }
  textarea, input[type=number] { width: 100%; padding: 8px 10px; border: 1px solid var(--border);
         border-radius: 8px; background: var(--bg); color: var(--text); font: inherit; }
  input[type=range] { width: 100%; accent-color: var(--accent); }
  button { flex: 1; padding: 10px; border-radius: 8px; border: 1px solid var(--border);
           background: var(--panel); color: var(--text); font: inherit; font-weight: 600; cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
  button:disabled { opacity: .5; cursor: not-allowed; }
  /* Selectorul de dataset: butoane lipite, cel activ colorat */
  .tabs { display: flex; gap: 4px; padding: 4px; margin-bottom: 4px; background: var(--bg);
          border: 1px solid var(--border); border-radius: 10px; }
  .tabs[hidden] { display: none; }
  .tabs button { padding: 6px 10px; border: none; background: transparent; }
  .tabs button.active { background: var(--accent); color: var(--accent-text); }
  .buttons { display: flex; gap: 8px; margin-top: 18px; }
  .examples { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 14px; }
  .examples button { flex: none; padding: 4px 10px; font-size: .8rem; font-weight: 500; }
  #output { margin: 0; min-height: 420px; white-space: pre-wrap; font-size: .9rem;
            font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
  .error { color: var(--error); }
  footer { margin-top: 24px; font-size: .85rem; color: var(--muted); }
  footer a { color: var(--accent); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Mini-GPT</h1>
    <p>Character-level Transformers trained from scratch. They run entirely in your browser, no server involved.</p>
    <div id="status">Loading…</div>
  </header>

  <div class="grid">
    <div class="panel">
      <div class="tabs" id="tabs" hidden></div>

      <label for="prompt">Prompt</label>
      <textarea id="prompt" rows="2"></textarea>

      <label for="tokens">Characters <span id="tokens-val">300</span></label>
      <input type="range" id="tokens" min="50" max="1000" step="50" value="300">

      <label for="temperature">Temperature <span id="temperature-val">0.8</span></label>
      <input type="range" id="temperature" min="0.1" max="2" step="0.1" value="0.8">

      <label for="topk">Top-k <span id="topk-val">40</span></label>
      <input type="range" id="topk" min="1" max="65" step="1" value="40">

      <label for="seed">Seed (-1 = random)</label>
      <input type="number" id="seed" value="-1">

      <div class="buttons">
        <button id="generate" class="primary" disabled>Generate</button>
        <button id="stop" disabled>Stop</button>
      </div>

      <div class="examples" id="examples"></div>
    </div>

    <div class="panel"><pre id="output"></pre></div>
  </div>

  <footer>
    Source code on <a href="https://github.com/gglvxx/mini-gpt">GitHub</a> · Inference with ONNX Runtime Web
  </footer>
</div>

<script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1/dist/ort.min.js"></script>
<script>
ort.env.wasm.wasmPaths = "https://cdn.jsdelivr.net/npm/onnxruntime-web@1/dist/";
ort.env.wasm.numThreads = 1;

// Ordinea taburilor. Un dataset fără model exportat e ignorat automat.
const DATASETS = ["shakespeare", "romanian"];

const $ = (id) => document.getElementById(id);
const metas = {};     // dataset -> meta.json (citite la pornire, sunt mici)
const sessions = {};  // dataset -> model ONNX (descărcat doar când dataset-ul e selectat)
let current = null;   // dataset-ul activ: { name, meta, session, stoi }
let running = false;
let stopRequested = false;

for (const id of ["tokens", "temperature", "topk"]) {
  $(id).addEventListener("input", () => ($(id + "-val").textContent = $(id).value));
}

// Generator aleatoriu cu seed (Math.random nu acceptă seed)
function mulberry32(seed) {
  return function () {
    seed = (seed + 0x6d2b79f5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

// Echivalentul JS din model.generate(): temperature -> top-k -> softmax -> extragere aleatorie
function sample(logits, temperature, topK, rand) {
  const scaled = Array.from(logits, (x) => x / temperature);
  const threshold = [...scaled].sort((a, b) => b - a)[Math.min(topK, scaled.length) - 1];
  const max = Math.max(...scaled);
  const probs = scaled.map((x) => (x >= threshold ? Math.exp(x - max) : 0));
  const sum = probs.reduce((a, b) => a + b, 0);

  let r = rand() * sum, last = 0;
  for (let i = 0; i < probs.length; i++) {
    if (probs[i] === 0) continue;
    last = i;
    r -= probs[i];
    if (r <= 0) return i;
  }
  return last;
}

// Rulează modelul activ o dată și returnează ID-ul următorului caracter
async function nextToken(ids, temperature, topK, rand) {
  const { meta, session } = current;
  const T = meta.block_size;
  const context = ids.slice(-T);
  const L = context.length;

  // Padding cu 0 DUPĂ prompt; masca cauzală face ca zerourile să nu influențeze poziția L-1
  const input = new BigInt64Array(T);
  context.forEach((id, i) => (input[i] = BigInt(id)));

  const feeds = { [session.inputNames[0]]: new ort.Tensor("int64", input, [1, T]) };
  const results = await session.run(feeds);
  const logits = results[session.outputNames[0]].data;

  const V = meta.chars.length;
  return sample(logits.subarray((L - 1) * V, L * V), temperature, topK, rand);
}

function setRunning(isRunning) {
  running = isRunning;
  $("generate").disabled = isRunning || !current;
  $("stop").disabled = !isRunning;
  document.querySelectorAll(".examples button, .tabs button").forEach((b) => (b.disabled = isRunning));
}

function renderExamples(examples) {
  const box = $("examples");
  box.innerHTML = "";
  for (const ex of examples) {
    const b = document.createElement("button");
    b.textContent = ex;
    b.addEventListener("click", () => {
      $("prompt").value = ex;
      generate();
    });
    box.appendChild(b);
  }
}

async function selectDataset(name) {
  if (running) return;
  current = null;
  $("generate").disabled = true;
  document.querySelectorAll(".tabs button").forEach((b) =>
    b.classList.toggle("active", b.dataset.name === name)
  );

  const meta = metas[name];
  $("status").classList.remove("error");
  $("status").textContent = `Loading the ${meta.label} model…`;

  try {
    if (!sessions[name]) {
      sessions[name] = await ort.InferenceSession.create(`models/${name}/model.onnx`);
    }
  } catch (e) {
    $("status").classList.add("error");
    $("status").textContent = "Failed to load the model: " + e.message;
    return;
  }

  current = { name, meta, session: sessions[name], stoi: new Map(meta.chars.map((ch, i) => [ch, i])) };

  // Top-k nu poate depăși mărimea vocabularului acestui dataset
  $("topk").max = meta.chars.length;
  if (+$("topk").value > meta.chars.length) {
    $("topk").value = meta.chars.length;
    $("topk-val").textContent = meta.chars.length;
  }

  renderExamples(meta.examples);
  $("prompt").value = meta.examples[0] || "";
  $("output").textContent = "";
  $("status").textContent =
    `${meta.description} · ${(meta.params / 1e6).toFixed(2)}M parameters · ` +
    `validation loss ${meta.val_loss} · running locally in your browser`;
  $("generate").disabled = false;
}

async function generate() {
  if (!current || running) return;
  const out = $("output");
  out.classList.remove("error");
  const prompt = $("prompt").value || "\n";

  const unknown = [...new Set(prompt)].filter((ch) => !current.stoi.has(ch));
  if (unknown.length) {
    out.classList.add("error");
    out.textContent = `Unknown characters for the ${current.meta.label} model: ${unknown.join(" ")}`;
    return;
  }

  const seed = parseInt($("seed").value, 10);
  const rand = Number.isInteger(seed) && seed >= 0 ? mulberry32(seed) : Math.random;
  const n = +$("tokens").value;
  const temperature = +$("temperature").value;
  const topK = +$("topk").value;

  const ids = [...prompt].map((ch) => current.stoi.get(ch));
  let text = prompt;
  out.textContent = text;
  stopRequested = false;
  setRunning(true);

  try {
    for (let i = 0; i < n && !stopRequested; i++) {
      const id = await nextToken(ids, temperature, topK, rand);
      ids.push(id);
      text += current.meta.chars[id];
      if (i % 5 === 0) {
        out.textContent = text;
        await new Promise((r) => setTimeout(r, 0));
      }
    }
    out.textContent = text;
  } catch (e) {
    out.classList.add("error");
    out.textContent = "Generation failed: " + e.message;
  } finally {
    setRunning(false);
  }
}

async function init() {
  // Descoperă ce modele au fost exportate (fiecare are un meta.json)
  for (const name of DATASETS) {
    try {
      const response = await fetch(`models/${name}/meta.json`);
      if (response.ok) metas[name] = await response.json();
    } catch (e) {
      // dataset neexportat: îl ignorăm
    }
  }

  const names = Object.keys(metas);
  if (!names.length) {
    $("status").classList.add("error");
    $("status").textContent = "No models found. Run: python export_onnx.py";
    return;
  }

  const tabs = $("tabs");
  for (const name of names) {
    const b = document.createElement("button");
    b.textContent = metas[name].label;
    b.dataset.name = name;
    b.addEventListener("click", () => selectDataset(name));
    tabs.appendChild(b);
  }
  tabs.hidden = names.length < 2;  // un singur model -> fără taburi

  await selectDataset(names[0]);
}

$("generate").addEventListener("click", generate);
$("stop").addEventListener("click", () => (stopRequested = true));
init();
</script>
</body>
</html>
