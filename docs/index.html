<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mini-GPT · In-browser demo</title>
<style>
  /* Culori definite o singură dată; varianta dark se aplică automat după setarea sistemului */
  :root {
    --bg: #f7f7f5; --panel: #ffffff; --text: #1d1d1f; --muted: #6b6b70;
    --border: #e2e2e0; --accent: #5b4bdb; --accent-text: #ffffff; --error: #c0392b;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121214; --panel: #1c1c1f; --text: #ececf0; --muted: #9a9aa3;
      --border: #2c2c31; --accent: #8b7cf6; --accent-text: #121214; --error: #ff6b5b;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font-family: system-ui, -apple-system, "Segoe UI", sans-serif; line-height: 1.5; }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 32px 16px; }
  header h1 { margin: 0 0 4px; font-size: 1.8rem; }
  header p { margin: 0; color: var(--muted); }
  #status { margin-top: 12px; font-size: .9rem; color: var(--muted); }
  .grid { display: grid; grid-template-columns: 320px 1fr; gap: 20px; margin-top: 24px; }
  @media (max-width: 800px) { .grid { grid-template-columns: 1fr; } }  /* pe telefon: o coloană */
  .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 18px; }
  label { display: block; font-size: .85rem; font-weight: 600; margin: 14px 0 6px; }
  label span { float: right; font-weight: 400; color: var(--muted); font-variant-numeric: tabular-nums; }
  .panel > label:first-child { margin-top: 0; }
  textarea, input[type=number] { width: 100%; padding: 8px 10px; border: 1px solid var(--border);
         border-radius: 8px; background: var(--bg); color: var(--text); font: inherit; }
  input[type=range] { width: 100%; accent-color: var(--accent); }
  .buttons { display: flex; gap: 8px; margin-top: 18px; }
  button { flex: 1; padding: 10px; border-radius: 8px; border: 1px solid var(--border);
           background: var(--panel); color: var(--text); font: inherit; font-weight: 600; cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
  button:disabled { opacity: .5; cursor: not-allowed; }
  .examples { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 14px; }
  .examples button { flex: none; padding: 4px 10px; font-size: .8rem; font-weight: 500; }
  #output { margin: 0; min-height: 420px; white-space: pre-wrap; font-size: .9rem;
            font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
  .error { color: var(--error); }
  footer { margin-top: 24px; font-size: .85rem; color: var(--muted); }
  footer a { color: var(--accent); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Mini-GPT</h1>
    <p>A character-level Transformer trained from scratch on Shakespeare. It runs entirely in your browser, no server involved.</p>
    <div id="status">Loading model…</div>
  </header>

  <div class="grid">
    <div class="panel">
      <label for="prompt">Prompt</label>
      <textarea id="prompt" rows="2">ROMEO:</textarea>

      <label for="tokens">Characters <span id="tokens-val">300</span></label>
      <input type="range" id="tokens" min="50" max="1000" step="50" value="300">

      <label for="temperature">Temperature <span id="temperature-val">0.8</span></label>
      <input type="range" id="temperature" min="0.1" max="2" step="0.1" value="0.8">

      <label for="topk">Top-k <span id="topk-val">40</span></label>
      <input type="range" id="topk" min="1" max="65" step="1" value="40">

      <label for="seed">Seed (-1 = random)</label>
      <input type="number" id="seed" value="-1">

      <div class="buttons">
        <button id="generate" class="primary" disabled>Generate</button>
        <button id="stop" disabled>Stop</button>
      </div>

      <div class="examples">
        <button data-prompt="ROMEO:">ROMEO:</button>
        <button data-prompt="KING HENRY:">KING HENRY:</button>
        <button data-prompt="First Citizen:">First Citizen:</button>
      </div>
    </div>

    <div class="panel"><pre id="output"></pre></div>
  </div>

  <footer>
    Source code on <a href="https://github.com/gglvxx/mini-gpt">GitHub</a> · Inference with ONNX Runtime Web
  </footer>
</div>

<script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1/dist/ort.min.js"></script>
<script>
// Fișierele WebAssembly ale ONNX Runtime se iau de pe același CDN.
// Un singur thread: GitHub Pages nu permite setările de securitate necesare pentru multi-threading.
ort.env.wasm.wasmPaths = "https://cdn.jsdelivr.net/npm/onnxruntime-web@1/dist/";
ort.env.wasm.numThreads = 1;

const $ = (id) => document.getElementById(id);
let session, meta, stoi;
let stopRequested = false;

// Afișează valoarea curentă lângă fiecare slider
for (const id of ["tokens", "temperature", "topk"]) {
  $(id).addEventListener("input", () => ($(id + "-val").textContent = $(id).value));
}

// Generator aleatoriu cu seed (Math.random nu acceptă seed).
// Notă: textul va diferi de cel din Python la același seed, generatoarele sunt diferite.
function mulberry32(seed) {
  return function () {
    seed = (seed + 0x6d2b79f5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

// Echivalentul JS din model.generate(): temperature -> top-k -> softmax -> extragere aleatorie
function sample(logits, temperature, topK, rand) {
  const scaled = Array.from(logits, (x) => x / temperature);
  // Pragul top-k = al K-lea cel mai mare scor; tot ce e sub prag devine imposibil
  const threshold = [...scaled].sort((a, b) => b - a)[Math.min(topK, scaled.length) - 1];
  const max = Math.max(...scaled);  // scădem maximul -> exp() nu dă overflow
  const probs = scaled.map((x) => (x >= threshold ? Math.exp(x - max) : 0));
  const sum = probs.reduce((a, b) => a + b, 0);

  let r = rand() * sum, last = 0;
  for (let i = 0; i < probs.length; i++) {
    if (probs[i] === 0) continue;
    last = i;
    r -= probs[i];
    if (r <= 0) return i;
  }
  return last;  // protecție la erori de rotunjire
}

// Rulează modelul o dată și returnează ID-ul următorului caracter
async function nextToken(ids, temperature, topK, rand) {
  const T = meta.block_size;
  const context = ids.slice(-T);  // doar ultimele block_size caractere (limita de context)
  const L = context.length;

  // Padding cu 0 DUPĂ prompt (modelul a fost exportat cu formă fixă [1, T]).
  // Masca cauzală garantează că zerourile de după nu influențează poziția L-1.
  const input = new BigInt64Array(T);
  context.forEach((id, i) => (input[i] = BigInt(id)));

  const feeds = { [session.inputNames[0]]: new ort.Tensor("int64", input, [1, T]) };
  const results = await session.run(feeds);
  const logits = results[session.outputNames[0]].data;  // formă [1, T, V], aplatizat

  const V = meta.chars.length;
  const row = logits.subarray((L - 1) * V, L * V);  // scorurile pentru ultimul caracter real
  return sample(row, temperature, topK, rand);
}

function setRunning(running) {
  $("generate").disabled = running;
  $("stop").disabled = !running;
  document.querySelectorAll(".examples button").forEach((b) => (b.disabled = running));
}

async function generate() {
  const out = $("output");
  out.classList.remove("error");
  const prompt = $("prompt").value || "\n";

  // Promptul poate conține doar caractere văzute la antrenare
  const unknown = [...new Set(prompt)].filter((ch) => !stoi.has(ch));
  if (unknown.length) {
    out.classList.add("error");
    out.textContent = `Unknown characters (not in the training data): ${unknown.join(" ")}`;
    return;
  }

  const seed = parseInt($("seed").value, 10);
  const rand = Number.isInteger(seed) && seed >= 0 ? mulberry32(seed) : Math.random;
  const n = +$("tokens").value;
  const temperature = +$("temperature").value;
  const topK = +$("topk").value;

  const ids = [...prompt].map((ch) => stoi.get(ch));
  let text = prompt;
  out.textContent = text;
  stopRequested = false;
  setRunning(true);

  try {
    for (let i = 0; i < n && !stopRequested; i++) {
      const id = await nextToken(ids, temperature, topK, rand);
      ids.push(id);
      text += meta.chars[id];
      if (i % 5 === 0) {
        out.textContent = text;
        await new Promise((r) => setTimeout(r, 0));  // lasă browserul să redeseneze pagina
      }
    }
    out.textContent = text;
  } catch (e) {
    out.classList.add("error");
    out.textContent = "Generation failed: " + e.message;
  } finally {
    setRunning(false);
  }
}

async function init() {
  try {
    meta = await (await fetch("meta.json")).json();
    stoi = new Map(meta.chars.map((ch, i) => [ch, i]));  // caracter -> ID, ca în tokenizer.py
    $("topk").max = meta.chars.length;
    session = await ort.InferenceSession.create("model.onnx");
    $("status").textContent =
      `Model loaded · ${(meta.params / 1e6).toFixed(2)}M parameters · ` +
      `validation loss ${meta.val_loss} · running locally in your browser`;
    $("generate").disabled = false;
  } catch (e) {
    $("status").classList.add("error");
    $("status").textContent = "Failed to load the model: " + e.message;
  }
}

$("generate").addEventListener("click", generate);
$("stop").addEventListener("click", () => (stopRequested = true));
document.querySelectorAll(".examples button").forEach((b) =>
  b.addEventListener("click", () => {
    $("prompt").value = b.dataset.prompt;
    generate();
  })
);

init();
</script>
</body>
</html>
